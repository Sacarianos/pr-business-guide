# "What I could not verify" (schema: src/lib/content-schema.ts). Populated by
# G-03; rendered permanently by G-16.

delegated-municipalities-list-stale:
  text:
    es: >-
      No hay una lista oficial al día de los municipios con autoridad
      delegada de permisos. La de agosto de 2016 tiene 11, una página del
      gobierno de 2015 tiene 8 y un artículo de 2018 tiene 10 más dos
      consorcios. Para los nueve municipios de esta guía las listas
      coinciden, pero ninguna dice qué trámites maneja cada uno.
    en: >-
      There is no current official list of the municipalities that hold
      delegated permit authority. The August 2016 one has 11, a 2015
      government page has 8, and a 2018 article has 10 plus two
      consortia. For the nine municipalities in this guide the lists
      agree, but none says which procedures each one handles.
  relatesTo: confirm-delegated-hierarchy

cfse-dtrh-rates-2026:
  text:
    es: >-
      Las primas del CFSE y las tasas de desempleo/SINOT del DTRH para
      2026 no están publicadas — solo se establecen las bases salariales.
    en: >-
      CFSE premium rates and 2026 DTRH unemployment/SINOT rates are
      unpublished — only the wage bases are stated.
  relatesTo: employer-registration-dtrh

llc-classification-determinaciones-administrativas:
  text:
    es: >-
      Las reglas de clasificación contributiva de la LLC descansan en las
      Determinaciones Administrativas 22-10 y 23-01 de Hacienda, ninguna
      de las cuales se pudo recuperar en texto completo.
    en: >-
      The LLC tax classification rules rest on Hacienda Determinaciones
      Administrativas 22-10 and 23-01, neither of which could be
      retrieved in full text.
  relatesTo: entity-llc-tax-classification

construction-permit-fees-unpublished:
  text:
    es: >-
      No se halló cuánto cuesta un permiso de construcción comercial. La
      página de Bayamón sobre el Permiso de Construcción Consolidado no
      lista cargos, y no se pudo confirmar dónde se publica la fórmula
      de OGPe.
    en: >-
      How much a commercial construction permit costs could not be
      found. Bayamón's page on the Consolidated Construction Permit
      lists no fees, and where OGPe publishes its formula could not be
      confirmed.
  relatesTo: construction-permit
