# Municipal patente rates for all 78 municipalities (schema:
# src/lib/content-schema.ts). The first nine were researched one by one (G-03);
# the rest come from the Colegio de CPA table "Tipos Contributivos de Patentes
# Municipales 2025-2026". `permits.delegated` follows the owner's list of 21
# delegated municipalities (see the confirm-delegated-hierarchy step). The
# estimator that consumes this is G-09.
#
# Rates are on business volume attributable to the municipality (Ley 107-2020,
# Código Municipal, Art. 7.202). Art. 7.202(b) sets a 0.50% ceiling on
# non-financial business; municipalities may set lower or tiered rates. The
# general floor is $25 (Art. 7.202(d)) — encoded per-municipio below as
# `minimum`, except San Juan, where the exempt band and the $25 flat band
# cannot both be expressed by a single top-level minimum (see its note).
# `sourcing: primary` mirrors the handoff's `verified: true`; `secondary`
# mirrors `verified: false` where a rate is reported but not confirmed against
# a primary text; `unverified` is used only for the generic statutory-ceiling
# fallback, which is not any specific municipality's confirmed rate.

sanjuan:
  name: "San Juan"
  sourcing: primary
  rate:
    type: tiered
    tiers:
      - { upTo: 12500, percent: 0 }
      - { upTo: 100000, percent: 0 }
      - { upTo: 300000, percent: 0.002 }
      - { upTo: null, percent: 0.005 }
  permits: { delegated: true, ogpe: false }
  portal:
    es: "tramite.sanjuan.pr, radicación electrónica obligatoria"
    en: "tramite.sanjuan.pr, electronic filing compulsory"
  note:
    es: >-
      Volumen hasta $12,500 exento. De $12,501 a $100,000 pagas $25 fijos.
      De $100,001 a $300,000, 0.20%. Sobre $300,000, 0.50%. San Juan
      también tiene un portal de incentivos en emprendimiento.sanjuan.pr.
    en: >-
      Volume up to $12,500 is exempt. From $12,501 to $100,000 you pay a
      flat $25. From $100,001 to $300,000, 0.20%. Above $300,000, 0.50%.
      San Juan also runs a business-incentive portal at
      emprendimiento.sanjuan.pr.

