# Decision-tree questions (schema: src/lib/content-schema.ts). Populated by G-03;
# branching between questions is decision-tree logic (G-06/G-08), not content.
#
# Keys match the answer-state keys the decision tree consumes (S.type, S.entity,
# etc. in the design handoff's build()) so G-06/G-08 can address a question and
# its answer by the same name. `driving` is only ever shown when `hiring` is
# answered `yes` — that branching rule lives in G-06, not here.

type:
  order: 1
  stage: 1
  label:
    es: "¿Qué vas a abrir?"
    en: "What are you opening?"
  input: options
  options:
    - value: retail
      label: { es: "Tienda / retail", en: "Store / retail" }
    - value: food
      label: { es: "Restaurante / cafetería", en: "Restaurant / café" }
    - value: prof
      label: { es: "Servicios profesionales", en: "Professional services" }
    - value: mfg
      label: { es: "Manufactura / distribución", en: "Manufacturing / distribution" }

entity:
  order: 2
  stage: 1
  label:
    es: "Forma legal"
    en: "Entity form"
  hint:
    es: "Define si tus bienes personales responden por el negocio, qué presentas, y cuánto pagas cada año."
    en: "Sets whether your personal assets answer for the business, what you file, and what you pay yearly."
  help:
    summary:
      es: "¿Cuál me conviene?"
      en: "Which one is right for me?"
    body:
      es: >-
        <b>La pregunta real es si tus bienes personales responden por el
        negocio.</b> Con un DBA, sí: si el negocio se endeuda o lo demandan,
        tu casa y tus cuentas quedan expuestas. Con una LLC o corporación,
        no — esa pared es por lo que la gente paga.<br><br>
        El propio Departamento de Estado lo dice claro: <b>no hace falta
        incorporarse</b> para operar en Puerto Rico. La gente se incorpora
        para proteger lo suyo, no porque la ley lo exija. Si vas a cargar
        inventario, firmar un lease, o emplear a alguien, esa pared casi
        siempre vale los par de cientos de pesos que cuesta.<br><br>
        <b>Entre LLC y corporación:</b> protegen igual. La LLC tiene menos
        formalidad y es lo que casi todo negocio pequeño escoge. La
        corporación existe para emitir acciones — si no vas a levantar
        capital, es papeleo de más.<br><br>
        <b>La trampa de la LLC en Puerto Rico:</b> tributa como corporación
        por defecto, al revés de como funciona a nivel federal, y la
        elección de PR va aparte de la federal. Equivocarse significa
        presentar la planilla que no es. Esta decisión la debe llevar un CPA
        de Puerto Rico.
      en: >-
        <b>The real question is whether your personal assets answer for the
        business.</b> With a DBA they do: if the business takes on debt or
        gets sued, your home and your accounts are exposed. With an LLC or
        corporation they do not — that wall is what people are paying
        for.<br><br>
        The Departamento de Estado's own guidance is blunt: <b>incorporating
        is not required</b> to operate in Puerto Rico. People incorporate to
        protect what is theirs, not because the law demands it. If you will
        carry inventory, sign a lease, or employ anyone, that wall is
        usually worth the few hundred dollars it costs.<br><br>
        <b>Between an LLC and a corporation:</b> both shield equally. An LLC
        carries less formality and is what nearly every small business
        picks. A corporation exists to issue shares — if you are not raising
        capital, it is extra paperwork.<br><br>
        <b>The Puerto Rico LLC trap:</b> it is taxed as a corporation by
        default, the opposite of the US federal default, and the PR election
        is separate from the federal one. Getting it wrong means filing the
        wrong return. Take this decision to a Puerto Rico CPA.
  input: options
  options:
    - value: llc
      label: { es: "LLC", en: "LLC" }
      detail:
        es: "Una pared entre el negocio y tu casa. Es lo que casi todo negocio pequeño escoge."
        en: "A wall between the business and your home. What nearly every small business picks."
    - value: corp
      label: { es: "Corporación", en: "Corporation" }
      detail:
        es: "La misma protección, con más formalidad. Existe para emitir acciones."
        en: "Same protection, more formality. It exists to issue shares."
    - value: sole
      label: { es: "Individuo / DBA", en: "Sole proprietor / DBA" }
      detail:
        es: "No presentas nada en el Departamento de Estado, y <b>tus bienes personales responden</b>."
        en: "Nothing is filed with the Departamento de Estado, and <b>your personal assets are exposed</b>."
    - value: unsure
      label: { es: "No estoy seguro", en: "Not sure yet" }
      detail:
        es: "Sigue contestando. La comparación completa está más abajo."
        en: "Keep answering. A full side-by-side comparison sits further down."

premises:
  order: 3
  stage: 1
  label:
    es: "¿Dónde vas a operar?"
    en: "Where will you operate?"
  help:
    summary:
      es: "¿Por qué importa tanto?"
      en: "Why does this matter so much?"
    body:
      es: >-
        <b>Esta respuesta cambia toda la ruta de permisos.</b> Un local
        comercial te lleva por zonificación, Permiso Único e inspección de
        Bomberos — la parte más larga del proceso, semanas o meses.<br><br>
        <b>Desde casa hay una vía propia.</b> Todo negocio necesita
        Permiso Único, también el que opera desde la casa. Ese usa el
        tipo Domiciliario, que cubre usos comerciales que no pasen del
        25% de la residencia, sin rótulo, sin recibir público y sin
        entregas.<br><br>
        <b>Móvil o pop-up</b> tiene su propia vía: patente provisional en
        cada municipio donde vendas, y reporte de volumen a las 24 horas de
        terminar la actividad.
      en: >-
        <b>This answer changes the whole permit path.</b> Commercial
        premises take you through zoning, the Permiso Único and a fire
        inspection — the longest part of the process, weeks or
        months.<br><br>
        <b>Working from home has its own track.</b> Every business needs
        a Permiso Único, including one run from home. That one uses the
        Domiciliario type, which covers commercial uses that do not
        exceed 25% of the residence, with no signage, no public visits
        and no deliveries.<br><br>
        <b>Mobile or pop-up</b> has its own track: a provisional patente in
        every municipality where you sell, plus a volume report 24 hours
        after the activity ends.
  input: options
  options:
    - value: commercial
      label: { es: "Local comercial", en: "Commercial premises" }
      detail:
        es: "La ruta más larga: zonificación, Permiso Único, Bomberos."
        en: "The longest path: zoning, Permiso Único, fire inspection."
    - value: home
      label: { es: "Mi casa, sin clientes", en: "My home, no client traffic" }
      detail:
        es: "Hay un Permiso Único <b>Domiciliario</b> para usar hasta el 25% de la casa, sin rótulo ni clientes."
        en: "There is a <b>Domiciliario</b> Permiso Único for using up to 25% of the home, with no signage or client visits."
    - value: mobile
      label: { es: "Móvil / pop-up", en: "Mobile / pop-up" }
      detail:
        es: "Patente provisional por municipio, y reporte de volumen a las 24 horas."
        en: "Provisional patente per municipality, plus a volume report after 24 hours."

buildout:
  order: 4
  stage: 1
  label:
    es: "¿Vas a remodelar o hacer buildout?"
    en: "Will you remodel or build out?"
  help:
    summary:
      es: "¿Qué cuenta como buildout?"
      en: "What counts as a buildout?"
    body:
      es: >-
        Cualquier obra que altere el local: tumbar o levantar paredes, mover
        plomería o electricidad, cambiar la fachada, o instalar una cocina.
        Pintura y muebles no cuentan.<br><br>
        <b>Importa porque activa un permiso de construcción</b>, que va
        antes del permiso de uso y del Permiso Único, y suele ser la partida
        más larga de todo el calendario — semanas o meses, con costo
        variable. Normalmente lo lleva el arquitecto o ingeniero de récord,
        no el dueño.
      en: >-
        Any work that alters the space: taking down or putting up walls,
        moving plumbing or electrical, changing the storefront, or
        installing a kitchen. Paint and furniture do not count.<br><br>
        <b>It matters because it triggers a construction permit</b>, which
        comes before the use permit and the Permiso Único, and is usually
        the longest line item on the whole schedule — weeks to months, at a
        variable cost. An architect or engineer of record normally drives
        it, not the owner.
  input: options
  options:
    - value: "yes"
      label: { es: "Sí", en: "Yes" }
    - value: "no"
      label: { es: "No, entro y opero", en: "No, move in and operate" }

muni:
  order: 5
  stage: 2
  label:
    es: "Municipio"
    en: "Municipality"
  hint:
    es: "Cambia tu tasa de patente y también si radicas los permisos en OGPe o en el municipio."
    en: "Changes both your patente rate and whether you file permits with OGPe or the municipality."
  help:
    summary:
      es: "¿Qué cambia de un municipio a otro?"
      en: "What changes from one municipality to another?"
    body:
      es: >-
        Dos cosas, y las dos cuestan dinero o tiempo.<br><br>
        <b>La tasa de la patente.</b> El techo estatutario es 0.50% del
        volumen (Art. 7.202), pero cada municipio fija la suya por ordenanza
        y varían bastante. San Juan exime los primeros $12,500 y luego cobra
        $25 fijos hasta $100,000; Peñuelas se queda por debajo del techo.
        La guía tiene la tasa de los 78 municipios.<br><br>
        <b>Dónde presentas los permisos.</b> Los municipios con jerarquía
        delegada procesan su propio Permiso Único; el resto va por OGPe.
        Proceso distinto, oficina distinta, calendario distinto. Hoy son 21
        municipios, solos o en consorcio.
      en: >-
        Two things, and both cost either money or time.<br><br>
        <b>The patente rate.</b> The statutory ceiling is 0.50% of volume
        (Art. 7.202), but each municipality sets its own by ordinance and
        they vary quite a bit. San Juan exempts the first $12,500 then
        charges a flat $25 up to $100,000; Peñuelas stays below the ceiling.
        This guide carries the rate for all 78 municipalities.<br><br>
        <b>Where you file permits.</b> Municipalities holding delegated
        hierarchy process their own Permiso Único; the rest go through OGPe.
        Different process, different office, different schedule. Today 21
        municipalities hold it, alone or in a consortium.
