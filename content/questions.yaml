exportsvc:
  order: 9
  stage: 3
  label:
    es: "¿Le vendes a clientes fuera de PR sin nexo local?"
    en: "Do you sell to clients outside PR with no local nexus?"
  help:
    summary:
      es: "¿Qué cuenta como «sin nexo local»?"
      en: "What counts as no local nexus?"
    body:
      es: >-
        <b>La prueba es mucho más estrecha de lo que la gente cree.</b> El
        Capítulo 3 de la Ley 60 se sostiene enteramente sobre servir a
        personas <b>fuera de Puerto Rico que no tengan nexo aquí</b>. Si tu
        cliente vive aquí, tiene oficina aquí, o el servicio beneficia una
        operación local, hay nexo y no cualifica.<br><br>
        Una tienda o un restaurante que le vende a gente que vive aquí tiene
        nexo por definición. Contesta que sí solo si le facturas a clientes
        de afuera cuyo negocio no toca la isla.<br><br>
        Al que te llene el plan de negocios con la Ley 60, algo te está
        vendiendo. Los incentivos reales para un negocio de esta escala son
        los municipales y los de PYME.
      en: >-
        <b>The test is far narrower than people assume.</b> Act 60
        Chapter 3 rests entirely on serving people <b>outside Puerto Rico
        who have no nexus here</b>. If your client lives here, keeps an
        office here, or the service benefits a local operation, there is
        nexus and it does not qualify.<br><br>
        A store or a restaurant selling to people who live here has nexus by
        definition. Answer yes only if you invoice clients abroad whose
        business does not touch the island.<br><br>
        Anyone padding your business plan with Act 60 is selling something.
        The real incentives at this scale are the municipal and PYME ones.
  input: options
  options:
    - value: "yes"
      label: { es: "Sí, exporto", en: "Yes, I export" }
    - value: "no"
      label: { es: "No, vendo aquí", en: "No, I sell here" }

