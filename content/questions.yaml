vol:
  order: 6
  stage: 2
  label:
    es: "Volumen bruto estimado del primer año"
    en: "Expected first-year gross volume"
  hint:
    es: "Volumen de negocios, no ganancia. Determina la patente, la exención del CRIM y los umbrales de auditoría."
    en: "Business volume, not profit. Drives the patente, the CRIM exemption, and audit thresholds."
  help:
    summary:
      es: "¿Volumen o ganancia?"
      en: "Volume or profit?"
    body:
      es: >-
        <b>Volumen es todo lo que vende el negocio, no lo que te queda.</b>
        Es la confusión más cara de esta página: si pones tu ganancia aquí,
        el estimado de patente sale mal, y la prueba de la exención del CRIM
        también.<br><br>
        Esta cifra mueve tres cosas: la <b>patente municipal</b> (un por
        ciento sobre el volumen, nunca sobre la ganancia), la <b>exención de
        $50,000 del CRIM</b> (que pide volumen neto de $150,000 o menos), y
        el umbral de <b>$3,000,000</b> sobre el cual hacen falta estados
        financieros auditados.<br><br>
        Si aún no has abierto, pon tu estimado del primer año. Un número
        aproximado sirve — lo que importa es el orden de magnitud.
      en: >-
        <b>Volume is everything the business sells, not what you keep.</b>
        This is the most expensive mix-up on the page: put your profit here
        and the patente estimate comes out wrong, along with the CRIM
        exemption test.<br><br>
        This figure drives three things: the <b>patente municipal</b> (a
        percentage on volume, never on profit), the <b>$50,000 CRIM
        exemption</b> (which asks for net volume of $150,000 or less), and
        the <b>$3,000,000</b> threshold above which audited financial
        statements are required.<br><br>
        If you have not opened yet, put your first-year estimate. A rough
        number works — order of magnitude is what matters.
  input: number

