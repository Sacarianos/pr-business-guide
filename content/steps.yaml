# Sequence steps (schema: src/lib/content-schema.ts). Populated by G-03 from
# docs/research/starting-a-business-in-puerto-rico.md and
# design/handoff/Guia Negocios PR.dc.html.
#
# This is the full catalog of steps that could appear in a reader's
# sequence — which ones actually show up, in what order, is decision-tree
# logic (G-06/G-08), not content. The design handoff's `warn` array (things
# that never had a task shape, like "the Reglamento Conjunto is legally
# unstable") is folded in here too, as steps carrying `severity: warn` or
# `stop` rather than a literal action — the schema note in
# src/lib/content-schema.ts already anticipates steps being "actions, artifacts,
# recurring duties, decisions."
#
# `sourcing` extracts the handoff's inline vt() badges into the structured
# field the schema wants. Where a step mixes a well-sourced legal
# requirement with a specific unconfirmed figure, `sourcing` reflects the
# step's central, most decision-relevant claim; the remaining caveat is kept
# as plain text in `note` (or, where it's a substantial open question, moved
# to content/gaps.yaml and cross-referenced by key in this file's comments).

# ---- Entity formation ----

entity-sole-proprietor:
  phase: formation
  title:
    es: "Operar como individuo (DBA)"
    en: "Operate as a sole proprietor (DBA)"
  agency: { es: "—", en: "—" }
  timing: { es: "—", en: "—" }
  cost: { es: "$0", en: "$0" }
  note:
    es: >-
      No se radica nada en el Departamento de Estado. El precio es alto:
      <b>los bienes personales responden por el negocio</b>. La propia
      guía del Departamento lo dice claro: no hay que incorporarse, la
      gente se incorpora para proteger lo suyo.
    en: >-
      Nothing is filed with the Departamento de Estado. The trade-off is
      total: <b>personal assets answer for the business</b>. The
      Departamento's own guidance is blunt that incorporation isn't
      required — people incorporate to protect personal assets.
  sourcing: primary

entity-organize-llc:
  phase: formation
  title:
    es: "Organizar la LLC"
    en: "Organize the LLC"
  agency: { es: "Depto. de Estado · RCE", en: "Dept. of State · RCE" }
  timing: { es: "1–5 días laborables", en: "1–5 business days" }
  cost: { es: "$250", en: "$250" }
  note:
    es: >-
      Se radica en <a href="https://rcp.estado.pr.gov/">rcp.estado.pr.gov</a>.
      El Departamento de Estado publica <b>$250</b> por el certificado de
      formación de una LLC. Se necesita un <b>agente residente con
      dirección física en Puerto Rico</b>; un apartado postal no cumple con
      el Art. 3.02. La ley fija recargos por servicio expedito de $100
      (24h), $200 (mismo día) y $500 (2h) (Art. 21.01(B)). La ley también
      fija un piso de $50, y el Secretario puede cambiar los cargos por
      carta circular.
    en: >-
      Filed at <a href="https://rcp.estado.pr.gov/">rcp.estado.pr.gov</a>.
      The Dept. of State posts <b>$250</b> for an LLC certificate of
      formation. Requires a <b>registered agent with a physical Puerto
      Rico address</b>; a P.O. box does not satisfy Art. 3.02. The statute
      sets expedited-service surcharges of $100 (24h), $200 (same day) and
      $500 (2h) (Art. 21.01(B)). It also sets a $50 floor, and the
      Secretary may reset fees by circular letter.
  sourcing: primary

entity-llc-tax-classification:
  phase: formation
  title:
    es: "Decidir la clasificación contributiva de la LLC"
    en: "Decide the LLC's PR tax classification"
  agency: { es: "Hacienda", en: "Hacienda" }
  timing: { es: "Al organizarse", en: "At formation" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      <b>Una LLC de Puerto Rico tributa como corporación por defecto</b>
      (Determinación Administrativa 22-10 de Hacienda), al revés de como
      funciona a nivel federal, y es la trampa más común para quien
      llega con la costumbre de allá afuera. Para los años contributivos
      que empiezan después del 31 de diciembre de 2021 se puede elegir
      tratamiento de <b>entidad conducto</b> (cualquier LLC) o de
      <b>entidad ignorada</b> (solo una LLC de un miembro cuyo dueño sea
      un individuo que cumpla los requisitos de la determinación). La
      elección se hace con el Modelo SC 6045, que se radica por vía
      electrónica como evidencia de la planilla, a más tardar en la
      fecha límite de la planilla, incluyendo prórroga (Determinación
      Administrativa 23-01). Después de un cambio de clasificación no se
      puede pedir otro durante 60 meses, salvo que más de 50% de la
      propiedad cambie de manos. <b>La elección de PR es aparte de la
      federal</b>. Equivocarse es radicar la planilla que no es y
      terminar pagando contribución dos veces. Esta decisión la debe
      llevar un CPA de Puerto Rico.
    en: >-
      <b>A Puerto Rico LLC is taxed as a corporation by default</b>
      (Hacienda Administrative Determination 22-10) — the opposite of
      the US federal default, and the single most common trap for anyone
      bringing mainland instincts. For tax years beginning after 31
      December 2021 an LLC can elect <b>pass-through</b> treatment (any
      LLC) or <b>disregarded entity</b> treatment (only a single-member
      LLC whose owner is an individual meeting the determination's
      requirements). The election is made on Form SC 6045, filed
      electronically as evidence of the tax return, no later than the
      return's due date including extensions (Administrative
      Determination 23-01). After a change of classification no other
      change can be requested for 60 months, unless more than 50% of the
      ownership changes hands. <b>The PR election is separate from the
      federal one</b>. Getting it wrong means filing the wrong return and
      possibly stacking two layers of tax. Take this one to a PR CPA.
  severity: warn
  professional: cpa
  sourcing: primary

entity-incorporate-corp:
  phase: formation
  title:
    es: "Incorporar"
    en: "Incorporate"
  agency: { es: "Depto. de Estado · RCE", en: "Dept. of State · RCE" }
  timing: { es: "1–5 días laborables", en: "1–5 business days" }
  cost: { es: "$150", en: "$150" }
  note:
    es: >-
      Se radica en <a href="https://rcp.estado.pr.gov/">rcp.estado.pr.gov</a>.
      El Departamento de Estado publica <b>$150</b> para registrar una
      corporación con acciones, y $5 para una sin fines de lucro. Se
      necesita un <b>agente residente con dirección física en Puerto
      Rico</b>; un apartado postal no cumple con el Art. 3.02. Se aplican
      recargos por servicio expedito de $100 (24h), $200 (mismo día) y
      $500 (2h). La ley fija un piso de $100, y el Secretario puede
      cambiar los cargos por carta circular.
    en: >-
      Filed at <a href="https://rcp.estado.pr.gov/">rcp.estado.pr.gov</a>.
      The Dept. of State posts <b>$150</b> to register a stock
      corporation, and $5 for a non-stock one. Requires a <b>registered
      agent with a physical Puerto Rico address</b>; a P.O. box does not
      satisfy Art. 3.02. Expedited-service surcharges of $100 (24h), $200
      (same day) and $500 (2h) apply. The statute sets a $100 floor, and
      the Secretary may reset fees by circular letter.
  sourcing: primary

entity-undecided:
  phase: formation
  kind: advisory
  title:
    es: "Decidir la forma legal antes de seguir"
    en: "Decide the entity form before anything else"
  agency: { es: "—", en: "—" }
  timing: { es: "Primero", en: "First" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      Esto define todo lo que sigue. En corto: un DBA no radica nada y
      no protege nada; una LLC o corporación cuesta unos cientos de
      pesos y pone una pared entre el negocio y la casa de quien lo
      opera. Si hay inventario, se firma un lease, o se contrata a
      alguien, esa pared casi siempre vale la pena.
    en: >-
      This gates everything downstream. The short version: a DBA files
      nothing and shields nothing; an LLC or corporation costs a few
      hundred dollars and puts a wall between the business and the
      owner's home. If the business carries inventory, signs a lease,
      or hires anyone, the wall is usually worth it.
  blocks:
    es: "Todos los pasos siguientes"
    en: "Every step that follows"
  severity: warn
  sourcing: primary

# ---- Federal / tax registration ----

ein-federal:
  phase: formation
  title:
    es: "Obtener el EIN federal"
    en: "Get the federal EIN"
  agency: { es: "IRS", en: "IRS" }
  timing: { es: "Minutos, en línea", en: "Minutes, online" }
  cost: { es: "$0", en: "$0" }
  note:
    es: >-
      En <a href="https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online">irs.gov</a>.
      El IRS lo dice claro: <b>nunca hay que pagar por un EIN</b>. Los
      sitios que cobran están revendiendo un formulario que es gratis.
      Un EIN por persona responsable por día.
    en: >-
      At <a href="https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online">irs.gov</a>.
      The IRS says it plainly: <b>you never have to pay for an EIN</b> —
      sites that charge are reselling a free form. One EIN per
      responsible party per day.
  sourcing: primary

merchant-registration:
  phase: formation
  title:
    es: "Registro de Comerciantes"
    en: "Merchant Registration Certificate"
  agency: { es: "Hacienda · SURI", en: "Hacienda · SURI" }
  timing:
    es: "ANTES de comenzar a operar"
    en: "BEFORE you begin operating"
  cost: { es: "$0", en: "$0" }
  note:
    es: >-
      En <a href="https://suri.hacienda.pr.gov/">suri.hacienda.pr.gov</a>.
      La ley es clara: se radica <b>antes</b> de comenzar a operar (Ley
      1-2011 §4060.01(b)). Las guías que dicen «dentro de 30 días» están
      confundiendo esto con otro deber: notificar <em>cambios</em>
      dentro de 30 días. Un registro <b>por cada local físico</b>; SURI
      no acepta dos en la misma dirección. El certificado se exhibe, y
      <b>vence a los dos años</b> sin período de gracia establecido. Al
      aprobarlo, Hacienda clasifica al comerciante como agente retenedor
      o no retenedor para el IVU — que quede bien desde el registro.
      Ningún cargo aparece en la ley ni en la carta circular, y Ayuda
      Legal PR dice que la solicitud no tiene costo en Hacienda.
    en: >-
      At <a href="https://suri.hacienda.pr.gov/">suri.hacienda.pr.gov</a>.
      The statute is unambiguous — file <b>before</b> beginning to
      operate (Ley 1-2011 §4060.01(b)). Guides that say "within 30 days"
      are confusing this with a different duty: notifying <em>changes</em>
      within 30 days. One registration <b>per physical location</b>;
      SURI will not accept two at the same address. The certificate must
      be displayed, and it <b>expires after two years</b> with no stated
      grace period. At approval Hacienda classifies the merchant as
      withholding or non-withholding agent for IVU — get that right at
      registration. No fee appears anywhere in the statute or the
      circular, and Ayuda Legal PR says the application costs nothing
      at Hacienda.
  severity: key
  blocks:
    es: "El Permiso Único y la póliza del CFSE"
    en: "The Permiso Único and the CFSE policy"
  sourcing: primary

# ---- Premises: commercial ----

zoning-verification:
  phase: premises
  title:
    es: "Verificar la zonificación por número de catastro"
    en: "Verify zoning by cadastral number"
  agency: { es: "Junta de Planificación", en: "Planning Board" }
  timing:
    es: "Mismo día — antes de firmar nada"
    en: "Same day — before signing anything"
  cost: { es: "$0", en: "$0" }
  note:
    es: >-
      Se consulta el número de catastro en
      <a href="https://gis.jp.pr.gov/mipr/">gis.jp.pr.gov/mipr</a>
      <b>antes de firmar el lease</b>. Coger un local cuya zonificación
      no aguanta el uso previsto es el error más caro que se puede
      cometer aquí, y el único que no se arregla con papeleo.
    en: >-
      Check the cadastral number at
      <a href="https://gis.jp.pr.gov/mipr/">gis.jp.pr.gov/mipr</a>
      <b>before signing a lease</b>. A lease on a property whose zoning
      will not carry the intended use is the most expensive avoidable
      mistake in this whole process — and the one that cannot be undone
      by paperwork.
  severity: key
  blocks:
    es: "Firmar el lease"
    en: "Signing the lease"
  sourcing: primary

construction-permit:
  phase: premises
  title:
    es: "Permiso de construcción"
    en: "Construction permit"
  agency: { es: "OGPe o municipio", en: "OGPe or municipality" }
  timing: { es: "Semanas a meses", en: "Weeks to months" }
  cost: { es: "≈0.5% a 1% del costo del proyecto, más cargos", en: "About 0.5% to 1% of project cost, plus fees" }
  note:
    es: >-
      Va antes del permiso de uso y del Permiso Único. En ciertos casos,
      planos certificados por un profesional autorizado sustituyen la
      revisión regular. Normalmente lo lleva el arquitecto o ingeniero
      de récord. Aplica el Código de Construcción de Puerto Rico 2018,
      basado en el International Building Code 2018, para los proyectos
      radicados desde el 15 de febrero de 2019. El cargo se estima en
      0.5% a 1% del costo total del proyecto, más un cargo base de $100
      a $500, un cargo de revisión de planos de $0.10 a $0.50 por pie
      cuadrado y, según el proyecto, cargos de impacto de infraestructura
      de $0.50 a $2.00 por pie cuadrado; en zonas históricas o especiales
      se suma 10% a 25%. Esas cifras vienen de una guía comercial sobre
      San Juan, no de OGPe. Bayamón lo llama Permiso de Construcción
      Consolidado (PCOC) y no publica sus cargos. Conviene presupuestar
      de más y conseguir un estimado con tiempo.
    en: >-
      Precedes the use permit and the Permiso Único. Certified plans by
      an authorized professional can substitute for conventional review
      in defined cases. Usually driven by the architect or engineer of
      record. The 2018 Puerto Rico Building Code, based on the 2018
      International Building Code, applies to projects filed since 15
      February 2019. The fee is estimated at 0.5% to 1% of total project
      cost, plus a base fee of $100 to $500, a plan review fee of $0.10
      to $0.50 per square foot and, depending on the project,
      infrastructure impact fees of $0.50 to $2.00 per square foot; in
      historic or special zones add 10% to 25%. Those figures come from a
      commercial guide on San Juan, not from OGPe. Bayamón calls it the
      Consolidated Construction Permit (PCOC) and does not publish its
      fees. Budget generously and get a professional estimate early.
  severity: warn
  blocks:
    es: "El permiso de uso y el Permiso Único"
    en: "The use permit and the Permiso Único"
  sourcing: secondary

permiso-unico:
  phase: operate
  title:
    es: "Permiso Único"
    en: "Permiso Único"
  agency: { es: "OGPe o municipio autónomo", en: "OGPe or autonomous municipality" }
  timing: { es: "Semanas — la ruta crítica", en: "Weeks — the critical path" }
  cost:
    es: "Desde $100: 10% al radicar, el 90% tras la validación"
    en: "From $100: 10% at filing, the other 90% after validation"
  note:
    es: >-
      Todo negocio necesita Permiso Único, opere desde donde opere.
      Se radica por el Single Business Portal en
      <a href="https://www.sbp.pr.gov/">sbp.pr.gov</a>, con OGPe o con el
      municipio si tiene autoridad delegada. Una sola solicitud
      consolida el permiso de uso, la exclusión categórica, la
      certificación de prevención de incendios, la certificación de
      salud ambiental y las licencias sanitarias. <b>No se puede pedir
      sin la autorización de uso del negocio</b>, y el Registro de
      Comerciantes es un anejo obligatorio de la solicitud — hay que
      tenerlo antes de radicar, no después. Coger un Profesional
      Autorizado (PA) es lo normal para cualquier cosa que no sea un
      cambio de nombre, y casi siempre se paga solo en el tiempo que
      ahorra. Los cargos son los mismos en todos los municipios. OGPe no
      publica su tarifario; el que publica el municipio de Bayamón es el
      que se usa: <b>$100 por radicación</b> ($150 en zona industrial),
      $150 más si se piden bebidas alcohólicas, $30 por el rótulo y $75
      por la exclusión categórica, además de la licencia sanitaria ($25 a
      $100) y la certificación de Bomberos (desde $50, según los pies
      cuadrados). El pago va en dos partes. Según el manual de OGPe
      (versión 1.2, noviembre de 2023), el primer pago es <b>10% del
      total de la solicitud</b> y el 90% restante se cobra después de que
      el analista valida; el Reglamento Conjunto 2020 daba cinco días
      para pagarlo, y hasta entonces la solicitud no se considera
      presentada. Si el sistema cobra 100% desde el principio, el caso se
      clasificó como ministerial, algo que nunca ocurre con los permisos
      domiciliarios (salvo oficina administrativa) y que tampoco ocurre
      con cafeterías, bares y otros usos regulados de cerca. El permiso
      <b>dura un año y se renueva cada año</b>: la continuación de
      operación (la renovación) se radica cuando faltan 45 días o menos
      para que venza, y un permiso vencido tiene hasta 2 años para
      radicarla, quizás con cargos adicionales.
    en: >-
      Every business needs a Permiso Único, wherever it operates from.
      Filed through the Single Business Portal at
      <a href="https://www.sbp.pr.gov/">sbp.pr.gov</a>, with OGPe or with
      the municipality if it holds delegated authority. One application
      consolidates the use permit, categorical exclusion, fire prevention
      certification, environmental health certification and sanitary
      licenses. <b>It cannot be requested without the use authorization
      for the business</b>, and the Merchant Registration Certificate is
      a mandatory attachment to the application, so it must exist before
      filing, not after. Hiring an Authorized Professional (PA) is
      standard practice for anything beyond a name change and usually
      pays for itself in elapsed time. The fees are the same in every
      municipality. OGPe does not publish its schedule; the one the
      Municipality of Bayamón publishes is the one in use: <b>$100 per
      filing</b> ($150 in industrial zones), $150 more when alcohol sales
      are requested, $30 for a business sign and $75 for a categorical
      exclusion, plus the sanitary license ($25 to $100) and the fire
      prevention certification (from $50, by square footage). Payment
      comes in two parts. Per OGPe's manual (version 1.2, November 2023),
      the first payment is <b>10% of the application total</b> and the
      remaining 90% is collected after the analyst validates; the 2020
      Reglamento Conjunto gave five days to pay it, and until then the
      application does not count as filed. If the system charges 100% up
      front, the case was classified as ministerial, which never happens
      with home-based permits (except administrative offices) and does
      not happen with cafeterias, bars and other closely regulated uses
      either. The permit <b>lasts one year and is renewed every
      year</b>: the continuation of operation (the renewal) is filed when
      45 days or fewer remain before it expires, and an expired permit
      has up to 2 years to file one, possibly with extra charges.
  severity: key
  blocks:
    es: "Abrir el negocio"
    en: "Opening the business"
  professional: attorney
  sourcing: primary

fire-inspection:
  phase: operate
  title:
    es: "Inspección de Bomberos"
    en: "Fire department inspection"
  agency: { es: "Negociado de Bomberos", en: "Fire Bureau" }
  timing: { es: "Dentro del Permiso Único", en: "Inside the Permiso Único" }
  cost: { es: "Desde $50, según los pies cuadrados", en: "From $50, by square footage" }
  note:
    es: >-
      Va incluida en el Permiso Único, pero es la parte que más se cae.
      Base para locales bajo 1,000 pies²: extintores ABC de 5 lb, uno
      por cada 75 pies; luces de emergencia en las rutas de evacuación;
      sistema eléctrico conforme a AEE; y <b>puertas que abran hacia
      afuera</b>. Las puertas que abren hacia adentro son el error
      clásico de buildout, y obligan a romper y hacerlo otra vez.
    en: >-
      Bundled into the Permiso Único, but it is the component most
      likely to fail. Baseline for premises under 1,000 sq ft: 5 lb ABC
      extinguishers one per 75 feet, emergency lighting on evacuation
      routes, AEE-compliant electrical, and <b>doors that open
      outward</b>. Inward-opening doors are a classic retail buildout
      failure that requires physical rework.
  sourcing: primary

sanitary-license:
  phase: operate
  title:
    es: "Licencia sanitaria"
    en: "Sanitary license"
  agency: { es: "Depto. de Salud", en: "Dept. of Health" }
  timing:
    es: "+3 a 8 semanas sobre la base"
    en: "+3 to 8 weeks over the baseline"
  cost: { es: "$25 a $100", en: "$25 to $100" }
  note:
    es: >-
      También va dentro del Permiso Único, pero tiene sus propios
      requisitos: local ya cogido, certificación de Bomberos en mano,
      patentes municipales, un <b>sistema de agua potable certificado
      por el Depto. de Salud</b>, planos y especificaciones, y una
      inspección sanitaria preoperacional. Quienes hacen esto todos los
      días lo dicen claro: hay que esperar <b>semanas, no días</b>,
      antes de la inspección. La lista de requisitos viene de gente que
      hace el trámite, no de una página de gobierno.
    en: >-
      Also bundled into the Permiso Único, but it carries its own
      prerequisites: premises already leased, Bomberos certification in
      hand, patentes municipales, a <b>potable water system certified
      by the Departamento de Salud</b>, plans and specifications, and a
      pre-operational sanitary inspection. Practitioner guidance is
      candid — expect <b>weeks, not days</b>, before they inspect. The
      prerequisite list comes from practitioner sources, not a
      government page.
  severity: warn
  sourcing: secondary

food-handler-certification:
  phase: operate
  title:
    es: "Certificación de manejo seguro de alimentos"
    en: "Food safety manager certification"
  agency: { es: "NRFSP / ServSafe", en: "NRFSP / ServSafe" }
  timing: { es: "Antes de abrir", en: "Before opening" }
  cost: { es: "Precio de mercado", en: "Market rate" }
  note:
    es: >-
      Vigente por tres años. Aparte de los <em>certificados de salud</em>
      individuales que emite el Depto. de Salud para cada manipulador.
    en: >-
      Valid for three years. Separate from the individual
      <em>certificados de salud</em> issued by the Departamento de Salud
      for each handler.
  sourcing: secondary

# ---- Premises: home ----

home-based-permiso-unico-question:
  phase: operate
  title:
    es: "Permiso Único Domiciliario (negocio desde la casa)"
    en: "Home-based Permiso Único (Domiciliario)"
  agency: { es: "OGPe o municipio", en: "OGPe or municipality" }
  timing: { es: "Antes de operar", en: "Before operating" }
  cost:
    es: "Desde $100 de radicación"
    en: "From $100 to file"
  note:
    es: >-
      Todo negocio necesita Permiso Único, también el que opera desde la
      casa. Ese usa el tipo de solicitud <b>Domiciliario</b>, para usos
      comerciales que no pasen del <b>25% de la residencia</b>. Según
      Bayamón, es para negocios que no alquilan un local y usan ese 25%
      como oficina administrativa, <b>sin rótulo, sin recibir público y
      sin entregas</b> en la propiedad. Se radica como Permiso Único y se
      escoge «Domiciliario» como tipo de solicitud; no se escoge el
      Permiso de Uso Residencial, que es para servicio de agua y luz.
      Cuesta $100 por radicación en cualquier municipio, más la licencia
      sanitaria ($25 a $100) y la certificación de Bomberos (desde $50).
    en: >-
      Every business needs a Permiso Único, including one run from home.
      That one uses the <b>Domiciliario</b> request type, for commercial
      uses that do not exceed <b>25% of the residence</b>. Per Bayamón,
      it is for businesses that do not rent premises and use that 25% as
      an administrative office, with <b>no signage, no public visits and
      no deliveries</b> at the property. File it as a Permiso Único and
      pick "Domiciliario" as the request type; do not pick the
      Residential Use Permit, which is for water and power service. It
      costs $100 to file in any municipality, plus the sanitary license
      ($25 to $100) and the fire prevention certification (from $50).
  severity: warn
  sourcing: primary

# ---- Premises: mobile ----

provisional-patente-occasional-sales:
  phase: operate
  title:
    es: "Patente provisional para ventas ocasionales"
    en: "Provisional patente for occasional sales"
  agency: { es: "Municipio", en: "Municipality" }
  timing: { es: "Antes de cada actividad", en: "Before each activity" }
  cost: { es: "Varía", en: "Varies" }
  note:
    es: >-
      Un negocio que hace ventas ocasionales tiene que sacar una
      <b>patente provisional</b> en ese municipio y reportar el volumen
      <b>dentro de 24 horas</b> de terminar la actividad. Si el volumen
      de ventas ocasionales se queda bajo $7,000, el pago de la patente
      provisional satisface la obligación. Los negocios móviles también
      cargan un cargo de $60 de Bomberos.
    en: >-
      A business making occasional sales must acquire a <b>provisional
      patente</b> in that municipality and report volume <b>within 24
      hours</b> of the activity ending. If occasional-sales volume stays
      under $7,000, the provisional patente payment satisfies the
      obligation. Mobile businesses also carry a $60 Bomberos fee.
  sourcing: primary

# ---- Municipal / property tax (applies broadly) ----

patente-municipal:
  phase: recurring
  title:
    es: "Patente municipal"
    en: "Patente municipal"
  agency: { es: "Municipio", en: "Municipality" }
  timing:
    es: "Notificar ≤30 días de comenzar"
    en: "Notify within 30 days of starting"
  cost: { es: "Según volumen", en: "By volume" }
  note:
    es: >-
      Se notifica al Director de Finanzas <b>dentro de 30 días de
      comenzar la actividad</b> y se recibe una <b>patente provisional
      exenta de pago por todo ese semestre</b> (Art. 7.210). No cuesta
      nada y la mayoría de los dueños la pierden por no notificar a
      tiempo — son los chavos más fáciles de todo el proceso. La
      declaración de volumen de negocios vence <b>dentro de los 5 días
      laborables siguientes al 15 de abril</b>, no el 15. Tiene que
      llevar una certificación de que los anejos de Hacienda adjuntos
      son copias fieles; <b>radicada sin esa certificación, cuenta como
      no radicada</b>. El pago es semestral, por adelantado, el 1 de
      julio y el 2 de enero, con <b>5% de descuento</b> por pagar
      completo al radicar. La tasa exacta y el mínimo dependen del
      municipio — ver content/municipios.yaml.
    en: >-
      Notify the Director de Finanzas <b>within 30 days of starting the
      activity</b> and receive a <b>provisional patente exempt from
      payment for that entire semester</b> (Art. 7.210). It costs
      nothing and most owners forfeit it simply by not notifying in
      time — this is the easiest money in the process. The declaración
      de volumen de negocios is due <b>within 5 business days following
      15 April</b> — not on the 15th. It must carry a certification that
      the attached Hacienda schedules are true copies; <b>filed without
      that certification, it counts as not filed</b>. Payment is
      semiannual, in advance, on 1 July and 2 January, with a <b>5%
      discount</b> for paying in full at filing. The exact rate and
      minimum depend on the municipality — see content/municipios.yaml.
  severity: key
  recurring: true
  sourcing: primary

crim-personal-property-return:
  phase: recurring
  title:
    es: "Planilla de bienes muebles · CRIM"
    en: "Personal property return · CRIM"
  agency: { es: "CRIM", en: "CRIM" }
  timing: { es: "15 de mayo, anual", en: "15 May, annually" }
  cost: { es: "Según tasación", en: "By assessed value" }
  note:
    es: >-
      Cubre inventario, maquinaria, equipo, muebles y enseres — por eso
      le pega mucho más duro al retail y a los restaurantes que a un
      consultor con una laptop. Un negocio dedicado a la venta al detal
      de bienes y servicios no profesionales, con volumen neto ≤$150,000
      y sin deuda de años anteriores que radique a tiempo, probablemente
      cualifica para la <b>exención de $50,000 de tasación</b> — pero
      <b>no es automática, hay que solicitarla</b>. Esta cifra viene del
      Colegio de CPA de Puerto Rico, no se verificó contra el texto de
      la ley. Las penalidades por radicar tarde corren a 5% por cada
      período de 30 días, con tope de 25%.
    en: >-
      Covers inventory, machinery, equipment, furniture and fixtures —
      which is why this bites retail and food service far harder than a
      consultant with a laptop. A business engaged in retail sales of
      goods and non-professional services, with net volume ≤$150,000 and
      no prior-year debt, filed on time, likely qualifies for the
      <b>$50,000 valuation exemption</b> — but <b>it is not automatic,
      it must be requested</b>. This figure comes from the Colegio de
      CPA de Puerto Rico and was not verified against the statute text.
      Late filing penalties run 5% per 30-day period, capped at 25%.
  recurring: true
  sourcing: secondary

# Same duty as above, for readers whose volume already puts the $50,000
# exemption out of reach. Two entries rather than one conditional
# paragraph, following the same pattern as the entity and IVU branches:
# which one a reader sees is decision-tree logic (G-06), keyed on the
# ≤$150,000 net-volume test.
crim-personal-property-return-above-ceiling:
  phase: recurring
  title:
    es: "Planilla de bienes muebles · CRIM"
    en: "Personal property return · CRIM"
  agency: { es: "CRIM", en: "CRIM" }
  timing: { es: "15 de mayo, anual", en: "15 May, annually" }
  cost: { es: "Según tasación", en: "By assessed value" }
  note:
    es: >-
      Cubre inventario, maquinaria, equipo, muebles y enseres — por eso
      le pega mucho más duro al retail y a los restaurantes que a un
      consultor con una laptop. <b>Con el volumen que indicaste quedas
      sobre el techo de $150,000</b>, así que la exención de $50,000 de
      tasación no aplica; hay que presupuestar la contribución completa
      sobre lo tasado. Las penalidades por radicar tarde corren a 5% por
      cada período de 30 días, con tope de 25%.
    en: >-
      Covers inventory, machinery, equipment, furniture and fixtures —
      which is why this bites retail and food service far harder than a
      consultant with a laptop. <b>At the volume you gave, you are above
      the $150,000 ceiling</b>, so the $50,000 valuation exemption does
      not apply — budget for the full assessed-value tax. Late filing
      penalties run 5% per 30-day period, capped at 25%.
  recurring: true
  sourcing: secondary

# ---- Hiring: yes ----

employer-registration-dtrh:
  phase: people
  title:
    es: "Registro de patrono · DTRH"
    en: "Employer registration · DTRH"
  agency: { es: "Depto. del Trabajo", en: "Dept. of Labor" }
  timing: { es: "Días, en línea", en: "Days, online" }
  cost: { es: "2.8% desempleo, 0.3% SINOT", en: "2.8% unemployment, 0.3% SINOT" }
  note:
    es: >-
      Un solo registro en <a href="https://www.trabajo.pr.gov/">trabajo.pr.gov</a>
      cubre tanto el seguro por desempleo como el SINOT (incapacidad
      temporal no ocupacional). Bases salariales tributables: <b>$7,000</b>
      para desempleo, <b>$9,000</b> para SINOT, más una contribución
      especial de 1% de los salarios tributables. Un patrono nuevo paga
      <b>2.8%</b> de desempleo en 2026 (el rango va de 1.2% a 5.4% según
      la experiencia) y <b>0.3%</b> de SINOT a cargo del patrono. Esas
      tasas vienen de una guía de nómina, no de una página del DTRH.
    en: >-
      One registration at <a href="https://www.trabajo.pr.gov/">trabajo.pr.gov</a>
      covers both unemployment insurance and SINOT (temporary
      non-occupational disability). Taxable wage bases: <b>$7,000</b>
      for unemployment, <b>$9,000</b> for SINOT, plus a special
      contribution of 1% of taxable wages. A new employer pays
      <b>2.8%</b> unemployment in 2026 (the range runs from 1.2% to 5.4%
      by experience) and <b>0.3%</b> SINOT as the employer's share.
      Those rates come from a payroll guide, not from a DTRH page.
  sourcing: secondary

cfse-policy:
  phase: people
  title:
    es: "Póliza del CFSE"
    en: "CFSE workers' comp policy"
  agency: { es: "Fondo del Seguro del Estado", en: "State Insurance Fund" }
  timing: { es: "Antes del primer empleado", en: "Before your first employee" }
  cost: { es: "Según la clase de riesgo, ≈0.5% a 5%+ de la nómina", en: "By risk class, roughly 0.5% to 5%+ of payroll" }
  note:
    es: >-
      <b>Toda persona que emplee a una o más personas tiene que tener
      póliza del CFSE.</b> Es el único que da esa póliza; no hay mercado
      privado donde cotizar. Esto no es papeleo de relleno: <b>operar
      sin póliza quita la protección de remedio exclusivo</b> y expone
      personalmente a responsabilidad civil por un accidente laboral.
      El CFSE pide el Registro de Comerciantes. La prima depende de la
      clase de riesgo de la industria: una guía de nómina la estima en
      0.5% a más de 5% de la nómina, y en 1.5% a 2% para trabajo de
      oficina.
    en: >-
      <b>Every person employing one or more people must hold a CFSE
      policy.</b> It is a monopoly public insurer — there is no private
      market to shop. This is not a paperwork formality: <b>operating
      without a policy strips the exclusive-remedy protection</b> and
      exposes the employer personally to tort liability for a
      workplace injury. CFSE asks for the Merchant Registration
      Certificate. The premium depends on the industry's risk class: a
      payroll guide puts it at roughly 0.5% to over 5% of payroll, and
      at 1.5% to 2% for office work.
  severity: stop
  sourcing: primary

drivers-social-security:
  phase: people
  title:
    es: "Seguro Social Choferil"
    en: "Chauffeur's Social Security"
  agency: { es: "DTRH", en: "DTRH" }
  timing: { es: "Con el primer conductor", en: "With the first driver" }
  cost:
    es: "$0.30/sem patrono + $0.50/sem empleado"
    en: "$0.30/wk employer + $0.50/wk employee"
  note:
    es: >-
      Cubre a cualquier empleado a quien el patrono exija o permita
      conducir <b>usual y regularmente</b> como parte integral del
      trabajo — sin importar cuántas horas. Una tienda con un
      repartidor, o un dependiente que hace gestiones en un vehículo del
      negocio, está dentro. Cuesta centavos y se le pasa a casi todo el
      mundo.
    en: >-
      Covers any employee the employer requires or permits to drive
      <b>usually and regularly</b> as an integral part of the work — for
      any number of hours. A store with a delivery driver, or a clerk
      who runs supply errands in a company vehicle, is in scope.
      Trivially cheap and very commonly missed.
  sourcing: primary

new-hire-reporting-asume:
  phase: people
  title:
    es: "Reporte de nuevos empleados · ASUME"
    en: "New hire reporting · ASUME"
  agency: { es: "ASUME", en: "ASUME" }
  timing: { es: "20 días del primer día", en: "20 days from first day" }
  cost: { es: "$0", en: "$0" }
  note:
    es: >-
      Hay que reportarlo <b>aunque el empleado renuncie o sea despedido
      antes de que pasen los 20 días</b>. La regla de 20 días está en la
      Ley 5 de 1986 (8 LPRA §509a) y en la página del Registro Estatal de
      Nuevos Empleados de ASUME. También se reporta a quien se recontrata
      tras 60 días seguidos de separación.
    en: >-
      Must be reported <b>even if the employee quits or is fired before
      the 20 days elapse</b>. The 20-day rule is in Ley 5 of 1986 (8 LPRA
      §509a) and on ASUME's State New Hire Registry page. A person
      rehired after 60 consecutive days of separation is also reported.
  sourcing: primary

christmas-bonus-and-21-employee-cliff:
  phase: people
  kind: advisory
  title:
    es: "El bono de Navidad y el precipicio de los 21 empleados"
    en: "The Christmas bonus and the 21-employee cliff"
  agency: { es: "—", en: "—" }
  timing: { es: "Entre el 15 de noviembre y el 15 de diciembre", en: "Between 15 November and 15 December" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      La Ley 148 de 1969 fija el bono en <b>2% del salario devengado</b>
      para cada empleado contratado desde el 26 de enero de 2017 que haya
      trabajado al menos <b>1,350 horas</b> entre el 1 de octubre y el 30
      de septiembre. El tope es <b>$300</b> si el patrono tiene 20
      empleados o menos y <b>$600</b> si tiene más de 20 durante más de
      26 semanas. Pasar de 20 a 21 duplica el tope por empleado — vale la
      pena tenerlo presente al planificar el crecimiento. El total de
      bonos no puede pasar de 15% de las ganancias netas anuales del
      patrono.
    en: >-
      Ley 148 of 1969 sets the bonus at <b>2% of salary earned</b> for
      each employee hired since 26 January 2017 who has worked at least
      <b>1,350 hours</b> between 1 October and 30 September. The cap is
      <b>$300</b> if the employer has 20 employees or fewer and
      <b>$600</b> if it has more than 20 for more than 26 weeks. Crossing
      from 20 to 21 doubles the per-employee cap — a real planning
      consideration when growing. Total bonuses cannot exceed 15% of the
      employer's annual net earnings.
  sourcing: primary

vacation-sick-leave-accrual:
  phase: people
  kind: advisory
  title:
    es: "Enfermedad acumula desde el principio; vacaciones, con efecto retroactivo al terminar el período probatorio"
    en: "Sick leave accrues from day one; vacation accrues retroactively once probation ends"
  agency: { es: "—", en: "—" }
  timing: { es: "Desde el período probatorio", en: "From the probationary period" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      La licencia por enfermedad acumula a <b>1 día por mes para todos
      los empleados, desde el inicio del período probatorio</b>. Las
      vacaciones acumulan a ½ día por mes en el primer año, subiendo con
      la antigüedad, pero <b>solo se reconocen, de forma retroactiva
      desde la fecha de inicio, cuando el empleado termina el período
      probatorio</b>. El umbral para acumular es 130 horas trabajadas al
      mes. Mientras dura el período probatorio no se pueden usar los días
      acumulados, y si el empleo termina en ese período normalmente no
      hay derecho a que se liquiden.
    en: >-
      Sick leave accrues at <b>1 day per month for all employees, from
      the start of the probationary period</b>. Vacation accrues at ½
      day/month in year one, rising with tenure, but it is <b>only
      recognized, retroactively to the start date, once the employee
      completes probation</b>. The threshold to accrue at all is 130
      hours worked per month. The accrued days cannot be used during
      probation, and if employment ends in that period there is
      typically no right to a payout.
  sourcing: secondary

# ---- Hiring: no ----

cfse-individual-track:
  phase: people
  title:
    es: "CFSE — vía de dueño individual"
    en: "CFSE — individual owner track"
  agency: { es: "Fondo del Seguro del Estado", en: "State Insurance Fund" }
  timing: { es: "Opcional sin empleados", en: "Optional with no employees" }
  cost: { es: "Varía", en: "Varies" }
  note:
