      Sin empleados, las obligaciones patronales no aplican. El CFSE sí
      tiene una vía <b>individual</b> para dueños de negocio y
      contratistas independientes — las entidades corporativas y las
      LLC <b>no se aceptan</b> en esa vía, y se pide el Certificado de
      Registro de Comerciante.
    en: >-
      With no employees the employer obligations do not attach. CFSE
      does run an <b>individual</b> track for business owners and
      independent contractors — note that corporate entities and LLCs
      are <b>not accepted</b> on that track, and it asks for the
      Merchant Registration Certificate.
  sourcing: primary

# ---- IVU / SUT ----

ivu-monthly-general:
  phase: recurring
  title:
    es: "IVU — cobro y remesa mensual"
    en: "IVU — collection and monthly remittance"
  agency: { es: "Hacienda · SURI", en: "Hacienda · SURI" }
  timing: { es: "Día 20 de cada mes", en: "By the 20th of each month" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      <b>Tasa combinada de 11.5%</b> — 10.5% estatal más 1% municipal.
      Se radica el Modelo SC 2915 electrónicamente <b>para el día 20 del
      mes siguiente</b>. <b>Se radica aunque no haya habido ventas
      tributables</b> — una planilla en cero sigue siendo una planilla.
      El 1% municipal sigue al municipio donde ocurrió la venta, lo que
      importa si se abre un segundo local. El Código de Rentas Internas
      consolidado todavía lee 6% y nunca menciona 10.5% en 1,104
      páginas; la tasa vigente es 11.5% — confirmada por Hacienda — pero
      nunca hay que citar el §4020.01 para sustentarla.
    en: >-
      <b>Combined rate 11.5%</b> — 10.5% state plus 1% municipal. File
      Modelo SC 2915 electronically by the <b>20th of the following
      month</b>. <b>File even in months with no taxable sales</b> — a
      zero return is still a return. The municipal 1% follows the
      municipality where the sale occurred, which matters when opening
      a second location. The consolidated tax code still reads 6% and
      never mentions 10.5% in 1,104 pages; the operative rate is
      11.5% — confirmed by Hacienda — but never cite §4020.01 for it.
  recurring: true
  sourcing: primary

ivu-monthly-b2b-professional:
  phase: recurring
  title:
    es: "IVU — servicios B2B y profesionales designados, 4%"
    en: "IVU — B2B and designated professional services, 4%"
  agency: { es: "Hacienda · SURI", en: "Hacienda · SURI" }
  timing: { es: "Día 20 de cada mes", en: "By the 20th of each month" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      <b>La tasa es 4%, no 11.5%.</b> Hacienda estableció desde el 1 de
      octubre de 2015 un IVU estatal especial de 4% para los servicios
      prestados a otros comerciantes (B2B) y los servicios profesionales
      designados — y <b>nada de eso va al municipio</b>. Los servicios
      profesionales designados incluyen legales, CPA, ingeniería y
      agrimensura, arquitectura, agronomía, geología, corretaje y
      tasación de bienes raíces. Cobrar 11.5% por error es cobrarle de
      más al cliente y radicar mal. No se encontró que lo hayan derogado.
    en: >-
      <b>The rate is 4%, not 11.5%.</b> Since 1 October 2015 Hacienda has
      set a special 4% state IVU for services rendered to other
      merchants (B2B) and for designated professional services — and
      <b>none of it goes to the municipality</b>. Designated professional
      services include legal, CPA, engineering and surveying,
      architecture, agronomy, geology, real estate brokerage and
      appraisal. Charging 11.5% by mistake is both an overcharge to the
      client and a filing error. No repeal was found.
  recurring: true
  sourcing: primary

# ---- Cross-cutting warnings ----

reglamento-conjunto-legally-unstable:
  phase: operate
  kind: advisory
  title:
    es: "La regla vigente es el Reglamento Conjunto de Emergencia de 2023"
    en: "The rule in force is the 2023 Emergency Joint Regulation"
  agency: { es: "—", en: "—" }
  timing: { es: "—", en: "—" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      La regla que se usa hoy para el Permiso Único es el <b>Reglamento
      Conjunto de Emergencia aprobado el 16 de junio de 2023</b>, que
      Bayamón cita como su base. Reemplazó al Reglamento Conjunto 2020,
      que el Tribunal Supremo declaró <b>nulo el 15 de marzo de 2023</b>
      por carecer del análisis de costo-beneficio que exige la LPAU. <b>La
      fecha de vencimiento se lee en el propio documento de permiso</b>,
      no de memoria.
    en: >-
      The rule in use today for the Permiso Único is the <b>Reglamento
      Conjunto de Emergencia approved on 16 June 2023</b>, which Bayamón
      cites as its basis. It replaced the 2020 Reglamento Conjunto, which
      the Tribunal Supremo declared <b>null on 15 March 2023</b> for
      lacking the cost-benefit analysis the LPAU requires. <b>The
      expiration date is read off the permit document itself</b>, not
      from memory.
  sourcing: secondary

confirm-delegated-hierarchy:
  phase: operate
  kind: advisory
  title:
    es: "Confirmar si el municipio tiene jerarquía delegada"
    en: "Confirm whether the municipality holds delegated hierarchy"
  agency: { es: "—", en: "—" }
  timing: { es: "—", en: "—" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      Esto determina si se radica en OGPe o en el municipio — proceso
      distinto, tiempos distintos, oficina distinta. Hay 21 municipios
      con autoridad delegada: 11 con jerarquía propia y 10 en consorcios.
      Los de jerarquía propia son San Juan, Bayamón, Caguas, Carolina,
      Guaynabo, Ponce, Aguadilla, Humacao, Fajardo y Cabo Rojo, más uno
      que no se pudo identificar. Los consorcios son el de Cidra (Cidra,
      Cayey, Coamo, Villalba y Salinas), el de la región montañosa
      (Barranquitas, Aibonito y Comerío) y uno del oeste (Aguada y
      Adjuntas). Mayagüez no está en la lista. La autoridad de cada uno
      depende de su convenio con el gobierno central, y desde el Código
      Municipal de 2020 las jerarquías van de la I a la III, así que ser
      autónomo no garantiza que tramite el Permiso Único.
    en: >-
      This determines whether to file with OGPe or with the
      municipality — different process, different timeline, different
      office. There are 21 municipalities with delegated authority: 11
      with their own hierarchy and 10 in consortia. Those with their own
      hierarchy are San Juan, Bayamón, Caguas, Carolina, Guaynabo, Ponce,
      Aguadilla, Humacao, Fajardo and Cabo Rojo, plus one that could not
      be identified. The consortia are Cidra's (Cidra, Cayey, Coamo,
      Villalba and Salinas), the mountain region's (Barranquitas,
      Aibonito and Comerío) and a western one (Aguada and Adjuntas).
      Mayagüez is not on the list. Each one's authority depends on its
      agreement with the central government, and since the 2020
      Municipal Code the hierarchies run from I to III, so being
      autonomous does not guarantee it handles the Permiso Único.
  severity: warn
  sourcing: secondary

above-3m-obligations-change:
  phase: operate
  kind: advisory
  title:
    es: "Sobre $3M cambian las obligaciones"
    en: "Above $3M the obligations change"
  agency: { es: "—", en: "—" }
  timing: { es: "—", en: "—" }
  cost: { es: "—", en: "—" }
  note:
    es: >-
      Sobre $3,000,000 de volumen se cruza el umbral de estados
      financieros auditados bajo el §1061.15 de la Ley 1-2011 — que
      entonces también hay que anejar a la declaración municipal de
      volumen, y <b>una declaración radicada sin ellos cuenta como no
      radicada</b>. Es además el umbral en que cualquier decreto de Ley
      60 adquiere requisito de empleo.
    en: >-
      Above $3,000,000 of volume the audited-financial-statements
      threshold under Ley 1-2011 §1061.15 is crossed — which then must
      also be attached to the municipal volume declaration, and <b>a
      declaration filed without them counts as not filed</b>. It is also
      the threshold at which any Act 60 decree acquires an employment
      requirement.
  sourcing: primary

state-annual-fee-survives:
  phase: recurring
  title:
    es: "El cargo anual del Depto. de Estado sigue vivo aunque el informe murió"
    en: "The State fee survives even though the annual report died"
  agency: { es: "Depto. de Estado", en: "Dept. of State" }
  timing: { es: "15 de abril, anual", en: "15 April, annually" }
  cost: { es: "$150", en: "$150" }
  note:
    es: >-
      Desde 2025 las corporaciones ya no radican informe anual (Ley 65
      de 2025), pero
      <b>el cargo anual sigue venciendo</b>: el Departamento de Estado
      publica <b>$150</b> de cuota anual para una LLC y para una
      corporación con acciones, con fecha límite el <b>15 de abril</b>.
      Una LLC que lo pase por alto tres años consecutivos ve su
      certificado de organización <b>cancelado</b>; una corporación
      arriesga revocación a los dos. El error más común es asumir que si
      no hay informe, no se debe nada. El aviso anterior sigue en la
      página de formularios del Departamento.
    en: >-
      For 2025 onward corporations no longer file an annual report (Law
      65 of 2025), but
      <b>the annual fee is still due</b>: the Dept. of State posts
      <b>$150</b> as the annual fee for an LLC and for a stock
      corporation, due by <b>15 April</b>. An LLC that misses it for
      three consecutive years has its certificate of organization
      <b>cancelled</b>; a corporation risks revocation after two. The
      most common failure mode is assuming that no report means nothing
      is owed. The old notice is still on the Department's forms page.
  severity: warn
  recurring: true
  sourcing: primary
