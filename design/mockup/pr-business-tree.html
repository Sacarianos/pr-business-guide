<title>Abrir un Negocio en Puerto Rico — Guía y Árbol de Decisiones</title>

<style>
  :root {
    --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#E3E8ED;
    --ink:#0F1620; --ink-2:#47535F; --ink-3:#6F7C89;
    --rule:#C7D0D8; --rule-soft:#DBE2E8;
    --sello:#0D5C63; --sello-soft:#DCEAEB;
    --ambar:#8A5800; --ambar-soft:#F6EBD5;
    --derogado:#99282A; --derog-soft:#F7E2E2;
    --verificado:#26624A; --verif-soft:#DDEBE3;
    --shadow:0 1px 2px rgba(15,22,32,.06), 0 4px 14px rgba(15,22,32,.05);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style",Charter,"Times New Roman",serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0F1620; --surface:#161F2B; --surface-2:#1E2938;
      --ink:#E4EAF0; --ink-2:#A6B4C2; --ink-3:#7C8B9B;
      --rule:#2C3949; --rule-soft:#232F3D;
      --sello:#4FB3BD; --sello-soft:#17333A;
      --ambar:#D9A441; --ambar-soft:#33280F;
      --derogado:#E58080; --derog-soft:#38191A;
      --verificado:#6BB894; --verif-soft:#16301F;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"]{
    --paper:#EDF0F3;--surface:#FFFFFF;--surface-2:#E3E8ED;
    --ink:#0F1620;--ink-2:#47535F;--ink-3:#6F7C89;
    --rule:#C7D0D8;--rule-soft:#DBE2E8;
    --sello:#0D5C63;--sello-soft:#DCEAEB;
    --ambar:#8A5800;--ambar-soft:#F6EBD5;
    --derogado:#99282A;--derog-soft:#F7E2E2;
    --verificado:#26624A;--verif-soft:#DDEBE3;
    --shadow:0 1px 2px rgba(15,22,32,.06),0 4px 14px rgba(15,22,32,.05);
  }
  :root[data-theme="dark"]{
    --paper:#0F1620;--surface:#161F2B;--surface-2:#1E2938;
    --ink:#E4EAF0;--ink-2:#A6B4C2;--ink-3:#7C8B9B;
    --rule:#2C3949;--rule-soft:#232F3D;
    --sello:#4FB3BD;--sello-soft:#17333A;
    --ambar:#D9A441;--ambar-soft:#33280F;
    --derogado:#E58080;--derog-soft:#38191A;
    --verificado:#6BB894;--verif-soft:#16301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  h1,h2,h3,h4,.ui{font-family:var(--sans)}

  /* ---------- language bar ---------- */
  .langbar{border-bottom:1px solid var(--rule-soft);background:var(--surface)}
  .langbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .site{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .seg button{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 14px;border:0;background:var(--surface);color:var(--ink-3);cursor:pointer;
    transition:background .12s,color .12s;
  }
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--sello);color:var(--surface);font-weight:700}
  .seg button:focus-visible{outline:2px solid var(--sello);outline-offset:-2px}

  /* ---------- masthead ---------- */
  .masthead{border-bottom:2px solid var(--ink);padding:38px 0 0;background:var(--surface)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sello);margin:0 0 14px}
  h1{font-size:clamp(30px,5.2vw,54px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 16px;text-wrap:balance}
  h1 .thin{font-weight:300;color:var(--ink-2);display:block;font-size:.56em;letter-spacing:-.01em;margin-top:8px}
  .dek{font-size:18px;color:var(--ink-2);margin:0 0 30px;max-width:62ch}

  .alerts{display:grid;gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
  @media (min-width:820px){.alerts{grid-template-columns:1fr 1fr}}
  .alert{background:var(--surface);padding:20px 24px}
  .alert .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:inline-block;padding:3px 7px;border:1px solid currentColor;border-radius:2px;margin-bottom:10px}
  .alert.cliff{color:var(--derogado)}
  .alert.stale{color:var(--ambar)}
  .alert p{margin:0;color:var(--ink);font-size:15px;line-height:1.5}
  .alert strong{font-family:var(--sans);font-weight:700}
  .countdown{font-family:var(--mono);font-weight:700}

  section{padding:56px 0;border-bottom:1px solid var(--rule-soft)}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  .sec-num{font-family:var(--mono);font-size:12px;color:var(--sello);letter-spacing:.08em}
  h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;font-weight:700;margin:0;text-wrap:balance}
  .sec-dek{color:var(--ink-2);margin:6px 0 28px;max-width:68ch;font-size:16px}

  figure{margin:0}
  .svg-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:18px;box-shadow:var(--shadow)}
  .svg-scroll svg{display:block;min-width:960px;width:100%;height:auto;color:var(--ink)}
  figcaption{font-size:14px;color:var(--ink-2);margin-top:14px;max-width:74ch}

  .tool{display:grid;gap:28px;align-items:start}
  @media (min-width:940px){.tool{grid-template-columns:380px 1fr;gap:40px}}
  .qpanel{display:flex;flex-direction:column;gap:22px;position:sticky;top:16px}
  @media (max-width:939px){.qpanel{position:static}}

  fieldset{border:0;padding:0;margin:0}
  legend{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--ink);padding:0;margin-bottom:9px;display:block}
  legend .q{font-family:var(--mono);color:var(--sello);font-size:11px;margin-right:7px}

  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{font-family:var(--sans);font-size:13px;line-height:1.25;padding:7px 11px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .opt:hover{border-color:var(--sello);color:var(--ink)}
  .opt:focus-visible{outline:2px solid var(--sello);outline-offset:2px}
  .opt[aria-pressed="true"]{background:var(--sello);border-color:var(--sello);color:var(--surface);font-weight:600}

  select,input[type="number"]{font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink);width:100%}
  select:focus-visible,input:focus-visible{outline:2px solid var(--sello);outline-offset:1px}
  .hint{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:6px}

  .reset{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink-3);padding:7px 12px;border-radius:2px;cursor:pointer;align-self:flex-start}
  .reset:hover{border-color:var(--derogado);color:var(--derogado)}
  .reset:focus-visible{outline:2px solid var(--sello);outline-offset:2px}

  .results{min-height:300px}
  .empty{border:1px dashed var(--rule);border-radius:3px;padding:44px 30px;text-align:center;color:var(--ink-3);font-family:var(--sans);font-size:14px}

  .rgroup{margin-bottom:34px}
  .rgroup > h3{font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule-soft);font-weight:400}

  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:3px;overflow:hidden}
  ol.steps > li{counter-increment:s;background:var(--surface);padding:16px 18px 16px 52px;position:relative}
  ol.steps > li::before{content:counter(s,decimal-leading-zero);position:absolute;left:16px;top:17px;font-family:var(--mono);font-size:11px;color:var(--sello);font-weight:700}
  .st-name{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em;display:block;margin-bottom:3px}
  .st-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
  .st-meta b{font-weight:400;color:var(--ink-2)}
  .st-note{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:0}
  .st-note a{color:var(--sello)}
  li.flag-key{border-left:3px solid var(--sello)}
  li.flag-warn{border-left:3px solid var(--ambar)}
  li.flag-stop{border-left:3px solid var(--derogado)}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px;margin-bottom:10px}
  .card h4{margin:0 0 5px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .card p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
  .card a{color:var(--sello)}
  .card.good{border-left:3px solid var(--verificado)}
  .card.warn{border-left:3px solid var(--ambar)}
  .card.stop{border-left:3px solid var(--derogado)}

  .numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:3px;overflow:hidden}
  .num{background:var(--surface);padding:15px 16px}
  .num .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
  .num .val{font-family:var(--sans);font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
  .num .sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);display:block;margin-top:4px;line-height:1.35}

  .vt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;border-radius:2px;border:1px solid;white-space:nowrap;vertical-align:1px}
  .vt-p{color:var(--verificado);border-color:var(--verificado);background:var(--verif-soft)}
  .vt-s{color:var(--ambar);border-color:var(--ambar);background:var(--ambar-soft)}
  .vt-u{color:var(--derogado);border-color:var(--derogado);background:var(--derog-soft)}

  .tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--sans);font-size:14px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
  th{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:400;background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:0}
  td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}

  .legend-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .legend-item{display:flex;gap:11px;align-items:flex-start}
  .legend-item p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.45}

  footer{padding:40px 0 60px;color:var(--ink-3);font-size:13.5px}
  footer a{color:var(--sello)}
  footer p{max-width:74ch}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</header>

        b: es
          ? "Esto determina si radicas en OGPe o en tu municipio — proceso distinto, tiempos distintos, oficina distinta. La lista autoritativa que encontré es de <b>agosto de 2016</b>: Aguadilla, Barranquitas, Bayamón, Cabo Rojo, Caguas, Carolina, Cidra, Guaynabo, Humacao, Ponce y San Juan. Casi seguro está incompleta a estas alturas. Llama y confirma."
          : "This determines whether you file with OGPe or with your municipality — different process, different timeline, different office. The authoritative list I could find dates from <b>August 2016</b>: Aguadilla, Barranquitas, Bayamón, Cabo Rojo, Caguas, Carolina, Cidra, Guaynabo, Humacao, Ponce and San Juan. Almost certainly incomplete by now. Call and confirm." });
    }
    if (m && m.verified === false && S.muni !== "other") {
      warn.push({ k:"warn",
        h: es ? "La tasa de patente de " + mn + " no está confirmada" : "The patente rate for " + mn + " is unconfirmed",
        b: es
          ? "La cifra usada en tu estimado viene de una tabla del Colegio de CPA extraída de un PDF multicolumna, y no se pudo garantizar la alineación de columnas en esa fila. Trata el número como indicativo y busca la ordenanza vigente de tu municipio antes de presupuestar con él."
          : "The figure used in your estimate comes from a CPA association table extracted from a multi-column PDF, and column alignment could not be guaranteed on that row. Treat the number as indicative only and pull your municipality's current ordinance before budgeting on it." });
    }
    if (v != null && v > 3000000) {
      warn.push({ k:"warn", h: es?"Sobre $3M cambian tus obligaciones":"Above $3M your obligations change",
        b: es
          ? "Sobre $3,000,000 de volumen cruzas el umbral de estados financieros auditados bajo el §1061.15 de la Ley 1-2011 — que entonces también hay que anejar a la declaración municipal de volumen, y <b>una declaración radicada sin ellos cuenta como no radicada</b>. Es además el umbral en que cualquier decreto de Ley 60 adquiere requisito de empleo."
          : "Above $3,000,000 of volume you cross the threshold for audited financial statements under Ley 1-2011 §1061.15 — which then must also be attached to your municipal volume declaration, and <b>a declaration filed without them counts as not filed</b>. It is also the threshold at which any Act 60 decree acquires an employment requirement." });
    }
    warn.push({ k:"warn",
      h: es?"El cargo anual del Depto. de Estado sigue vivo aunque el informe murió":"The State fee survives even though the report died",
      b: es
        ? "Desde 2025 las corporaciones ya no radican informe anual — pero <b>el cargo anual sigue venciendo</b>, observado en <b>$150 para el 15 de abril</b>. Una LLC que lo pase por alto tres años consecutivos ve su certificado de organización <b>cancelado</b>; una corporación arriesga revocación a los dos. El modo de falla más común es asumir que si no hay informe, no se debe nada."
        : "For 2025 onward corporations no longer file an annual report — but <b>the annual fee is still due</b>, observed at <b>$150 by 15 April</b>. An LLC that misses it for three consecutive years has its certificate of organization <b>cancelled</b>; a corporation risks revocation after two. The most common failure mode is assuming that no report means nothing is owed." });

    /* --- gaps --- */
    if (es) {
      gaps.push("OGPe no publica un tarifario que yo pudiera hallar — solo el mecanismo de pagar 10% al radicar y el balance tras la evaluación. Cualquier cifra de costo del Permiso Único aquí es un estimado, no un número sustentado.");
      gaps.push("El intervalo de renovación del Permiso Único no se pudo establecer desde ninguna fuente primaria, porque el reglamento que lo gobierna lleva en litigio desde 2023.");
      gaps.push("La lista de municipios con autoridad delegada de permisos es de agosto de 2016 y casi seguro está desactualizada.");
      gaps.push("Las primas del CFSE y las tasas de desempleo/SINOT del DTRH para 2026 no están publicadas — solo se establecen las bases salariales.");
      if (S.premises === "home") gaps.push("Si un negocio en casa sin tráfico de clientes necesita Permiso Único es genuinamente ambiguo en la ley — y es justo la pregunta que más te importa.");
      if (S.entity === "llc") gaps.push("Las reglas de clasificación de la LLC descansan en las Determinaciones Administrativas 22-10 y 23-01 de Hacienda, ninguna de las cuales pude recuperar en texto completo.");
    } else {
      gaps.push("OGPe publishes no fee schedule I could find — only the mechanic that you pay 10% at filing and the balance after evaluation. Any Permiso Único cost figure here is an estimate, not a sourced number.");
      gaps.push("The Permiso Único renewal interval could not be established from any primary source, because the governing regulation has been in litigation since 2023.");
      gaps.push("The delegated-permit-authority municipality list dates from August 2016 and is almost certainly stale.");
      gaps.push("CFSE premium rates and 2026 DTRH unemployment/SINOT rates are unpublished — only the wage bases are stated.");
      if (S.premises === "home") gaps.push("Whether a home-based business with no client traffic needs a Permiso Único at all is genuinely ambiguous in the statute — and it is the question that matters most to you.");
      if (S.entity === "llc") gaps.push("The LLC classification rules rest on Hacienda Determinaciones Administrativas 22-10 and 23-01, neither of which I could retrieve in full text.");
    }

    return { steps:steps, inc:inc, warn:warn, gaps:gaps, pat:p, muni:m };
  }

  /* ==================== render ==================== */
  function answered() { return Object.keys(S).filter(function (k) { return S[k] !== null && S[k] !== ""; }).length; }

  function render() {
    var out = document.getElementById("out");
    if (answered() < 3) { out.innerHTML = '<div class="empty">' + T.ui.empty + "</div>"; return; }
    var r = build(), es = L === "es", h = "";

    var weeks = "—", fees = "—";
    if (S.premises === "commercial") weeks = S.type === "food" ? "10–20+" : "6–14";
    else if (S.premises === "home") weeks = "1–2";
    else if (S.premises === "mobile") weeks = "2–4";
    if (S.type === "food") fees = "$800–1,700";
    else if (S.premises === "home") fees = "$150–400";
    else if (S.premises) fees = "$550–1,100";

    h += '<div class="rgroup"><h3>' + T.ui.glance + '</h3><div class="numbers">';
    h += '<div class="num"><span class="lab">' + T.ui.nWeeks + '</span><span class="val">' + weeks + '</span><span class="sub">' + T.ui.nWeeksSub + '</span></div>';
    h += '<div class="num"><span class="lab">' + T.ui.nFees + '</span><span class="val">' + fees + '</span><span class="sub">' + T.ui.nFeesSub + '</span></div>';
    h += '<div class="num"><span class="lab">' + T.ui.nPat1 + '</span><span class="val">$0</span><span class="sub">' + T.ui.nPat1Sub + '</span></div>';
    h += '<div class="num"><span class="lab">' + T.ui.nPat + '</span><span class="val">' + (r.pat ? (r.pat.amt === 0 ? "$0" : money(r.pat.amt)) : "—") + '</span><span class="sub">' + (r.muni ? esc(muniName(r.muni)) : T.ui.nPatSub) + '</span></div>';
    h += "</div></div>";

    h += '<div class="rgroup"><h3>' + T.ui.seq.replace("{n}", r.steps.length) + '</h3><ol class="steps">';
    r.steps.forEach(function (s) {
      h += '<li class="' + (s.flag ? "flag-" + s.flag : "") + '"><span class="st-name">' + esc(s.n) + "</span>";
      h += '<div class="st-meta"><span><b>' + esc(s.ag) + "</b></span><span>" + esc(s.when) + "</span><span>" + esc(s.cost) + "</span></div>";
      h += '<p class="st-note">' + s.note + "</p></li>";
    });
    h += "</ol></div>";

    if (r.inc.length) {
      h += '<div class="rgroup"><h3>' + T.ui.incentives + "</h3>";
      r.inc.forEach(function (c) { h += '<div class="card ' + c.k + '"><h4>' + esc(c.h) + "</h4><p>" + c.b + "</p></div>"; });
      h += "</div>";
    }
    if (r.warn.length) {
      h += '<div class="rgroup"><h3>' + T.ui.warnings + "</h3>";
      r.warn.forEach(function (c) { h += '<div class="card ' + c.k + '"><h4>' + esc(c.h) + "</h4><p>" + c.b + "</p></div>"; });
      h += "</div>";
    }
    h += '<div class="rgroup"><h3>' + T.ui.gaps + '</h3><div class="card warn"><p>' +
         r.gaps.map(function (g) { return "· " + esc(g); }).join("<br><br>") + "</p></div></div>";

    out.innerHTML = h;
  }

  function renderMuniTable() {
    var tb = document.getElementById("munibody"), h = "";
    MUNI_ORDER.forEach(function (k) {
      var m = MUNIS[k];
      var badge = m.verified ? '<span class="vt vt-p">' + T.vt.p + "</span>" : '<span class="vt vt-s">' + T.vt.s + "</span>";
      h += "<tr><td><b>" + esc(m.name) + "</b> " + badge + "</td>";
      h += '<td class="n">' + esc(L === "es" ? m.rate_es : m.rate_en) + "</td>";
      h += "<td>" + (m.delegated ? T.tPermD : T.tPermO) + "</td>";
      h += "<td>" + esc(L === "es" ? m.portal_es : m.portal_en) + "</td></tr>";
    });
    tb.innerHTML = h;
  }

  function applyStatic() {
    document.querySelectorAll("[data-i]").forEach(function (el) {
      var val = dig(T, el.getAttribute("data-i"));
      if (val != null) el.textContent = val;
    });
    document.querySelectorAll("[data-h]").forEach(function (el) {
      var val = dig(T, el.getAttribute("data-h"));
      if (val != null) el.innerHTML = val;
    });
    var vol = document.getElementById("vol");
    vol.setAttribute("aria-label", T.q.vol);
    document.getElementById("muni").setAttribute("aria-label", T.q.muni);
    document.getElementById("diagram").setAttribute("aria-label",
      L === "es"
        ? "Diagrama de flujo: una cadena de identidad legal y contributiva y una cadena de local corren en paralelo y desembocan en el Permiso Único, que consolida cinco certificaciones y condiciona la apertura. Las obligaciones municipales y patronales se ramifican en paralelo y no bloquean la apertura."
        : "Flow diagram: a legal-and-tax-identity chain and a premises chain run in parallel and converge on the Permiso Único, which bundles five clearances and gates opening for business. Municipal and employer obligations branch off in parallel and do not block opening.");
    // countdown lives inside a translated string, so re-bind after each swap
    var cd = document.getElementById("cd");
    if (cd) {
      var d = Math.ceil((new Date(2026, 11, 31) - new Date()) / 86400000);
      cd.textContent = d > 0 ? (L === "es" ? d + " días" : d + " days") : (L === "es" ? "el plazo cerró" : "the window has closed");
    }
  }

  function setLang(next) {
    L = next; T = D[next];
    document.documentElement.lang = next;
    document.getElementById("lang-es").setAttribute("aria-pressed", String(next === "es"));
    document.getElementById("lang-en").setAttribute("aria-pressed", String(next === "en"));
    applyStatic(); renderMuniTable(); render();
  }

  /* ==================== wiring ==================== */
  document.querySelectorAll(".opts").forEach(function (grp) {
    var key = grp.getAttribute("data-key");
    grp.querySelectorAll(".opt").forEach(function (b) {
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-v"), already = S[key] === v;
        S[key] = already ? null : v;
        grp.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        if (!already) b.setAttribute("aria-pressed", "true");
        if (key === "hiring") {
          var fd = document.getElementById("fs-driving");
          fd.hidden = S.hiring !== "yes";
          if (S.hiring !== "yes") { S.driving = null; fd.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", "false"); }); }
        }
        render();
      });
    });
  });

  document.getElementById("muni").addEventListener("change", function (e) { S.muni = e.target.value; render(); });
  document.getElementById("vol").addEventListener("input", function (e) {
    var n = parseFloat(e.target.value); S.vol = isNaN(n) ? null : n; render();
  });
  document.getElementById("reset").addEventListener("click", function () {
    Object.keys(S).forEach(function (k) { S[k] = (k === "muni") ? "" : null; });
    document.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
    document.getElementById("muni").value = "";
    document.getElementById("vol").value = "";
    document.getElementById("fs-driving").hidden = true;
    render();
  });
  document.getElementById("lang-es").addEventListener("click", function () { setLang("es"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });

  setLang("es");
})();
</script>
